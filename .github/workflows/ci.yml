name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The test suite must never make a real API call. An empty key also exercises the
  # reduced-mode path, which is how most people will first run the project.
  ANTHROPIC_API_KEY: ""
  PERSISTENCE_ENABLED: "false"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest -q --cov=dqcopilot --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Alembic migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dqcopilot
          POSTGRES_PASSWORD: dqcopilot
          POSTGRES_DB: dqcopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dqcopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade to head, then downgrade to base
        env:
          DATABASE_URL: postgresql+psycopg://dqcopilot:dqcopilot@localhost:5432/dqcopilot
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Fail if the models have drifted from the migrations
        env:
          DATABASE_URL: postgresql+psycopg://dqcopilot:dqcopilot@localhost:5432/dqcopilot
        run: |
          # An autogenerated revision against an up-to-date database must be empty.
          alembic revision --autogenerate -m "drift-check" --rev-id drift_check
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|alter_column)" \
             alembic/versions/*drift_check*.py; then
            echo "::error::The SQLAlchemy models have drifted from the migrations."
            cat alembic/versions/*drift_check*.py
            exit 1
          fi
          rm -f alembic/versions/*drift_check*.py

  demo-data:
    name: Demo data regenerates identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate twice and compare
        run: |
          python scripts/generate_demo_data.py --output /tmp/demo-a
          python scripts/generate_demo_data.py --output /tmp/demo-b
          diff -r /tmp/demo-a /tmp/demo-b

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dqcopilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the full stack and wait for the healthcheck
        run: |
          docker compose up --build --detach
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dqcopilot-app 2>/dev/null || echo starting)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              echo "the application is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The application never became healthy."
          docker compose logs
          exit 1

      - name: Show logs and tear down
        if: always()
        run: |
          docker compose logs --no-color || true
          docker compose down --volumes
